databases:
  - name: leena-db
    plan: free
    databaseName: leena
    user: leena

services:
  - type: web
    name: leena-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: cd .. && npm install && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leena-db
          property: connectionString
      - key: AI_LLM_PROVIDER
        value: featherless
      - key: FEATHERLESS_MODEL
        value: zai-org/GLM-4-9B-0414
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: AI_SPEECH_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
