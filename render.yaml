# Render Blueprint for the Leena API.
#
# Covers the web service and its Postgres. Render Workflows are deliberately
# absent: Blueprints cannot create or manage them yet, so the Workflow
# service (post-session analysis, see server/src/workflows/) has to be added
# by hand in the dashboard: New > Workflow, point it at this repo with root
# dir "server", build command "npm ci", start command "npm run workflow".
# Once that service exists, set RENDER_API_KEY and RENDER_WORKFLOW_TASK_SLUG
# (format "workflow-slug/analyzeSession") on leena-server below so
# POST /sessions/:id/end dispatches to it instead of running in-process.
#
# Secrets (sync: false) are never in this file. Render prompts for them on
# first deploy and stores them itself.

databases:
  - name: leena-db
    plan: free
    databaseName: leena
    user: leena

services:
  - type: web
    name: leena-server
    runtime: node
    plan: free
    rootDir: server
    # npm ci, not npm install: it installs exactly what package-lock.json
    # pins, so a deploy can't silently pick up a different dependency version
    # than the one the tests ran against. The `cd ..` is required because this
    # is an npm workspace -- dependencies are hoisted to the repo root, so
    # installing from inside server/ alone would miss them.
    buildCommand: cd .. && npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: leena-db
          property: connectionString
      - key: AI_LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Featherless is still supported (same provider class, different base
      # URL) but unused: the hackathon plan that paid for it has ended. Set
      # AI_LLM_PROVIDER=featherless and these two to switch back.
      - key: FEATHERLESS_MODEL
        value: deepseek-ai/DeepSeek-V3-0324
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: AI_SPEECH_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # Both optional -- see the note at the top of this file. Leave unset
      # (or delete these two) to keep running session analysis in-process.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK_SLUG
        sync: false

  # The Expo web build of the app, served as static files. Worth having beyond
  # convenience: a student can open a link instead of installing Expo Go and
  # scanning a QR, which for an audience that skews older and less
  # smartphone-confident removes the most likely point of failure in a pilot.
  #
  # Static sites also do not spin down on the free plan, unlike the API above,
  # so the page itself is always instant even when the first API call has to
  # wake the server.
  - type: web
    name: leena-app
    runtime: static
    rootDir: app
    # cd .. first: this is an npm workspace, so dependencies hoist to the repo
    # root and installing from inside app/ alone would miss them.
    buildCommand: cd .. && npm ci && cd app && npx expo export --platform web
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time, not read at runtime -- changing it
      # requires a rebuild, not a restart. Hardcoded rather than derived from
      # the service above because fromService yields a bare host with no
      # scheme, and the client needs a full origin.
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://leena-server.onrender.com
    routes:
      # Client-side routing: React Navigation owns the URL after load, so every
      # path has to be served the same index.html or a refresh on any screen
      # other than the root 404s.
      - type: rewrite
        source: /*
        destination: /index.html
