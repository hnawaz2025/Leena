# Render Blueprint for the Leena API.
#
# Covers the web service and its Postgres. Render Workflows are deliberately
# absent: Blueprints cannot create or manage them yet, so the Workflow
# service (post-session analysis, see server/src/workflows/) has to be added
# by hand in the dashboard: New > Workflow, point it at this repo with root
# dir "server", build command "npm ci", start command "npm run workflow".
# Once that service exists, set RENDER_API_KEY and RENDER_WORKFLOW_TASK_SLUG
# (format "workflow-slug/analyzeSession") on leena-server below so
# POST /sessions/:id/end dispatches to it instead of running in-process.
#
# Secrets (sync: false) are never in this file. Render prompts for them on
# first deploy and stores them itself.

databases:
  - name: leena-db
    plan: free
    databaseName: leena
    user: leena

services:
  - type: web
    name: leena-server
    runtime: node
    plan: free
    rootDir: server
    # npm ci, not npm install: it installs exactly what package-lock.json
    # pins, so a deploy can't silently pick up a different dependency version
    # than the one the tests ran against. The `cd ..` is required because this
    # is an npm workspace -- dependencies are hoisted to the repo root, so
    # installing from inside server/ alone would miss them.
    buildCommand: cd .. && npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: leena-db
          property: connectionString
      - key: AI_LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Featherless is still supported (same provider class, different base
      # URL) but unused: the hackathon plan that paid for it has ended. Set
      # AI_LLM_PROVIDER=featherless and these two to switch back.
      - key: FEATHERLESS_MODEL
        value: deepseek-ai/DeepSeek-V3-0324
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: AI_SPEECH_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # Both optional -- see the note at the top of this file. Leave unset
      # (or delete these two) to keep running session analysis in-process.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK_SLUG
        sync: false
